name: local-deps

services:
  postgres:
    image: postgres:16
    container_name: local-postgres
    environment:
      POSTGRES_USER: solier
      POSTGRES_PASSWORD: solier
      POSTGRES_DB: coredb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${LOCAL_INITDB_DIR:-.}:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solier -d coredb"]
      interval: 5s
      timeout: 3s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    container_name: local-neo4j
    environment:
      NEO4J_AUTH: neo4j/local-neo4j-password
      NEO4J_initial_dbms_default__database: feeddb
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p local-neo4j-password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

networks:
  default:
    name: local
    external: true
